operations:
  view:
    - type: web
      impl: index.html
actions: actions
web: web-src
runtimeManifest:
  packages:
    # Package name MUST be `admin-ui-sdk` and the registration action MUST be
    # named `registration` — the Admin UI SDK looks them up by these names.
    admin-ui-sdk:
      license: Apache-2.0
      actions:
        registration:
          function: actions/registration/index.js
          web: 'yes'
          runtime: nodejs:22
          inputs:
            LOG_LEVEL: debug
          annotations:
            require-adobe-auth: true
            final: true

    # Every action below touches App Builder Database, so every one needs the IMS
    # Server-to-Server credentials declared as `inputs`. They are NOT inherited
    # from .env at runtime — that omission returns HTTP 500 from a deployed
    # action while working fine locally.
    menu-manager:
      license: Apache-2.0
      actions:
        menu-list:
          function: actions/menu/list.js
          web: 'yes'
          runtime: nodejs:22
          inputs:
            LOG_LEVEL: debug
            IMS_OAUTH_S2S_CLIENT_ID: $IMS_OAUTH_S2S_CLIENT_ID
            IMS_OAUTH_S2S_CLIENT_SECRET: $IMS_OAUTH_S2S_CLIENT_SECRET
            IMS_OAUTH_S2S_ORG_ID: $IMS_OAUTH_S2S_ORG_ID
            IMS_OAUTH_S2S_SCOPES: $IMS_OAUTH_S2S_SCOPES
            AIO_DB_REGION: $AIO_DB_REGION
          annotations:
            require-adobe-auth: true
            final: true
        menu-get:
          function: actions/menu/get.js
          web: 'yes'
          runtime: nodejs:22
          inputs:
            LOG_LEVEL: debug
            IMS_OAUTH_S2S_CLIENT_ID: $IMS_OAUTH_S2S_CLIENT_ID
            IMS_OAUTH_S2S_CLIENT_SECRET: $IMS_OAUTH_S2S_CLIENT_SECRET
            IMS_OAUTH_S2S_ORG_ID: $IMS_OAUTH_S2S_ORG_ID
            IMS_OAUTH_S2S_SCOPES: $IMS_OAUTH_S2S_SCOPES
            AIO_DB_REGION: $AIO_DB_REGION
          annotations:
            require-adobe-auth: true
            final: true
        menu-save:
          function: actions/menu/save.js
          web: 'yes'
          runtime: nodejs:22
          inputs:
            LOG_LEVEL: debug
            IMS_OAUTH_S2S_CLIENT_ID: $IMS_OAUTH_S2S_CLIENT_ID
            IMS_OAUTH_S2S_CLIENT_SECRET: $IMS_OAUTH_S2S_CLIENT_SECRET
            IMS_OAUTH_S2S_ORG_ID: $IMS_OAUTH_S2S_ORG_ID
            IMS_OAUTH_S2S_SCOPES: $IMS_OAUTH_S2S_SCOPES
            AIO_DB_REGION: $AIO_DB_REGION
          annotations:
            require-adobe-auth: true
            final: true
        menu-delete:
          function: actions/menu/delete.js
          web: 'yes'
          runtime: nodejs:22
          inputs:
            LOG_LEVEL: debug
            IMS_OAUTH_S2S_CLIENT_ID: $IMS_OAUTH_S2S_CLIENT_ID
            IMS_OAUTH_S2S_CLIENT_SECRET: $IMS_OAUTH_S2S_CLIENT_SECRET
            IMS_OAUTH_S2S_ORG_ID: $IMS_OAUTH_S2S_ORG_ID
            IMS_OAUTH_S2S_SCOPES: $IMS_OAUTH_S2S_SCOPES
            AIO_DB_REGION: $AIO_DB_REGION
          annotations:
            require-adobe-auth: true
            final: true
        item-list:
          function: actions/item/list.js
          web: 'yes'
          runtime: nodejs:22
          inputs:
            LOG_LEVEL: debug
            IMS_OAUTH_S2S_CLIENT_ID: $IMS_OAUTH_S2S_CLIENT_ID
            IMS_OAUTH_S2S_CLIENT_SECRET: $IMS_OAUTH_S2S_CLIENT_SECRET
            IMS_OAUTH_S2S_ORG_ID: $IMS_OAUTH_S2S_ORG_ID
            IMS_OAUTH_S2S_SCOPES: $IMS_OAUTH_S2S_SCOPES
            AIO_DB_REGION: $AIO_DB_REGION
          annotations:
            require-adobe-auth: true
            final: true
        item-save:
          function: actions/item/save.js
          web: 'yes'
          runtime: nodejs:22
          inputs:
            LOG_LEVEL: debug
            IMS_OAUTH_S2S_CLIENT_ID: $IMS_OAUTH_S2S_CLIENT_ID
            IMS_OAUTH_S2S_CLIENT_SECRET: $IMS_OAUTH_S2S_CLIENT_SECRET
            IMS_OAUTH_S2S_ORG_ID: $IMS_OAUTH_S2S_ORG_ID
            IMS_OAUTH_S2S_SCOPES: $IMS_OAUTH_S2S_SCOPES
            AIO_DB_REGION: $AIO_DB_REGION
          annotations:
            require-adobe-auth: true
            final: true
        item-delete:
          function: actions/item/delete.js
          web: 'yes'
          runtime: nodejs:22
          inputs:
            LOG_LEVEL: debug
            IMS_OAUTH_S2S_CLIENT_ID: $IMS_OAUTH_S2S_CLIENT_ID
            IMS_OAUTH_S2S_CLIENT_SECRET: $IMS_OAUTH_S2S_CLIENT_SECRET
            IMS_OAUTH_S2S_ORG_ID: $IMS_OAUTH_S2S_ORG_ID
            IMS_OAUTH_S2S_SCOPES: $IMS_OAUTH_S2S_SCOPES
            AIO_DB_REGION: $AIO_DB_REGION
          annotations:
            require-adobe-auth: true
            final: true
        item-reorder:
          function: actions/item/reorder.js
          web: 'yes'
          runtime: nodejs:22
          inputs:
            LOG_LEVEL: debug
            IMS_OAUTH_S2S_CLIENT_ID: $IMS_OAUTH_S2S_CLIENT_ID
            IMS_OAUTH_S2S_CLIENT_SECRET: $IMS_OAUTH_S2S_CLIENT_SECRET
            IMS_OAUTH_S2S_ORG_ID: $IMS_OAUTH_S2S_ORG_ID
            IMS_OAUTH_S2S_SCOPES: $IMS_OAUTH_S2S_SCOPES
            AIO_DB_REGION: $AIO_DB_REGION
          annotations:
            require-adobe-auth: true
            final: true
        # Read-only catalog lookups for the V2 admin pickers (categories, and CMS
        # pages once a source exists). require-adobe-auth like the other admin
        # actions. No DB, so no IMS_OAUTH_S2S_* — only the demo-catalog COMMERCE_*.
        catalog-list:
          function: actions/catalog/list.js
          web: 'yes'
          runtime: nodejs:22
          inputs:
            LOG_LEVEL: debug
            COMMERCE_ENDPOINT: 'https://www.aemshop.net/cs-graphql'
            COMMERCE_HEADERS: '{"Store":"default","Magento-Store-Code":"main_website_store","Magento-Store-View-Code":"default","Magento-Website-Code":"base","x-api-key":"4dfa19c9fe6f4cccade55cc5b3da94f7","Magento-Environment-Id":"f38a0de0-764b-41fa-bd2c-5bc2f3c7b39a"}'
          annotations:
            require-adobe-auth: true
            final: true
        # Web-hosted admin UI (serves HTML + its JSON API from one endpoint).
        # NOT require-adobe-auth so a browser can reach it; protected by a
        # constant-time ADMIN_SECRET instead (demo-grade, not per-user IMS auth —
        # the production admin is the Admin UI SDK SPA). COMMERCE_* are the public
        # demo-catalog values (already in the repo's config.json) used only to
        # populate the category picker.
        admin:
          function: actions/admin/index.js
          web: 'yes'
          runtime: nodejs:22
          inputs:
            LOG_LEVEL: debug
            ADMIN_SECRET: $ADMIN_SECRET
            COMMERCE_ENDPOINT: 'https://www.aemshop.net/cs-graphql'
            COMMERCE_HEADERS: '{"Store":"default","Magento-Store-Code":"main_website_store","Magento-Store-View-Code":"default","Magento-Website-Code":"base","x-api-key":"4dfa19c9fe6f4cccade55cc5b3da94f7","Magento-Environment-Id":"f38a0de0-764b-41fa-bd2c-5bc2f3c7b39a"}'
            IMS_OAUTH_S2S_CLIENT_ID: $IMS_OAUTH_S2S_CLIENT_ID
            IMS_OAUTH_S2S_CLIENT_SECRET: $IMS_OAUTH_S2S_CLIENT_SECRET
            IMS_OAUTH_S2S_ORG_ID: $IMS_OAUTH_S2S_ORG_ID
            IMS_OAUTH_S2S_SCOPES: $IMS_OAUTH_S2S_SCOPES
            AIO_DB_REGION: $AIO_DB_REGION
          annotations:
            final: true

        # Storefront read path, consumed by API Mesh — NOT by browsers directly.
        # Deliberately not require-adobe-auth: the storefront is anonymous.
        # Protected by a shared secret checked in constant time in lib/auth.js.
        storefront-menu-get:
          function: actions/storefront/menu-get.js
          web: 'yes'
          runtime: nodejs:22
          inputs:
            LOG_LEVEL: debug
            STOREFRONT_SHARED_SECRET: $STOREFRONT_SHARED_SECRET
            IMS_OAUTH_S2S_CLIENT_ID: $IMS_OAUTH_S2S_CLIENT_ID
            IMS_OAUTH_S2S_CLIENT_SECRET: $IMS_OAUTH_S2S_CLIENT_SECRET
            IMS_OAUTH_S2S_ORG_ID: $IMS_OAUTH_S2S_ORG_ID
            IMS_OAUTH_S2S_SCOPES: $IMS_OAUTH_S2S_SCOPES
            AIO_DB_REGION: $AIO_DB_REGION
          annotations:
            final: true

        # Async consumer for Adobe I/O Events. Non-web.
        event-category-changed:
          function: actions/events/category-changed.js
          web: 'no'
          runtime: nodejs:22
          inputs:
            LOG_LEVEL: debug
            IMS_OAUTH_S2S_CLIENT_ID: $IMS_OAUTH_S2S_CLIENT_ID
            IMS_OAUTH_S2S_CLIENT_SECRET: $IMS_OAUTH_S2S_CLIENT_SECRET
            IMS_OAUTH_S2S_ORG_ID: $IMS_OAUTH_S2S_ORG_ID
            IMS_OAUTH_S2S_SCOPES: $IMS_OAUTH_S2S_SCOPES
            AIO_DB_REGION: $AIO_DB_REGION
